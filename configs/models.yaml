  qwen3.5-397b-a17b: { family: qwen3.5, ladder: qwen3.5-moe, params_b: 397, active_params_b: 17, openrouter: qwen/qwen3.5-397b-a17b, hf_repo: Qwen/Qwen3.5-397B-A17B, thinking: true }
  gemma3-4b:  { family: gemma3, ladder: gemma3, params_b: 4, active_params_b: 4, openrouter: google/gemma-3-4b-it, hf_repo: google/gemma-3-4b-it }
