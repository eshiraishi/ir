# Datasets used by TRICE. Validation splits are deliberately never loaded.
#
# Every source is pinned: git sources by commit, HTTP sources by SHA-256. `trice data fetch`
# refuses files whose hash does not match. A `sha256: null` entry is recorded on first fetch
# and must then be committed here (see docs/preregistration.md, data freeze).
#
# `labels` maps the raw tag type to the verbalization shown to every model. The same strings
# are used by all prompt formats; inline-tag names are derived from them (spaces -> "_").
# The loader fails on any raw label that is not listed, so typos cannot silently drop entities.

sources:
  crossner:
    kind: git
    url: https://github.com/zliucr/CrossNER
    commit: 2e7ba2a7798c961e3f29fbc51252c5a8d40224bf
  wnut17:
    kind: git
    url: https://github.com/leondz/emerging_entities_17
    commit: e52a2d2a71ac1a051ca2d532eef28653c5c02603
  ncbi_disease:
    kind: git
    url: https://github.com/spyysalo/ncbi-disease
    commit: 5a266c6fc76fb2b5184cfa397ff0a5ecdb133aec
  mit_sls:
    kind: http

datasets:
  crossner_politics:
    source: crossner
    format: token_tag
    files:
      train: { path: ner_data/politics/train.txt, sha256: 1d8be31abb58463349496fe21b13d70114cf015294a9ff9cce77af9b83e8aa84 }
      test: { path: ner_data/politics/test.txt, sha256: 05cadc5e129d394f7f92b4a052cf4b6ea4c60878d32a833e500cf046c297455f }
    expected: { train: 200, test: 651 }
    labels:
      country: country
      election: election
      event: event
      location: location
      misc: miscellaneous
      organisation: organisation
      person: person
      politicalparty: political party
      politician: politician

  crossner_science:
