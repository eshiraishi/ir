# TRICE configuration: the single source of truth, parsed by trice.settings.Settings.
# Secrets (OPENROUTER_API_KEY, HF_TOKEN) live in .env, never here.

[paths]
data = "data"
results = "results"
cache = "cache"

[llm]
openrouter_url = "https://openrouter.ai/api/v1"
local_url = "http://127.0.0.1:8000/v1"
temperature = 0.0
top_p = 1.0
seed = 0
max_tokens = 1024
max_retries = 8
timeout = 300.0
workers = 16
# Endpoint pinning: most faithful precision first, then cheapest, then provider name.
quantization_preference = ["bf16", "fp16", "fp32", "fp8", "int8", "fp6", "fp4", "int4", "unknown"]
# Every format must work on the pinned provider (P2 needs structured outputs).
required_parameters = ["temperature", "top_p", "seed", "max_tokens", "stop", "response_format", "structured_outputs"]

[retrieval]
rrf_k = 60            # Cormack et al. (2009); fixed, never tuned
rerank_depth = 200    # fused candidates reranked; exhaustive for every CrossNER pool
store_depth = 200     # candidates stored per query and stage
device = "cpu"
threads = 8
batch_size = 32
reranker_instruction = "Given a sentence, retrieve sentences that mention similar kinds of named entities in a similar context."

[retrieval.stacks.small]   # default: every model < 1B, Apache-2.0, CPU-feasible
kind = "trice"
sparse = { id = "opensearch-project/opensearch-neural-sparse-encoding-doc-v3-gte" }
dense = { id = "Qwen/Qwen3-Embedding-0.6B" }
reranker = { id = "Qwen/Qwen3-Reranker-0.6B" }

[retrieval.stacks.large]   # S2 ablation through OpenRouter
kind = "trice"
sparse = { id = "opensearch-project/opensearch-neural-sparse-encoding-doc-v3-gte" }
dense = { id = "qwen/qwen3-embedding-8b", backend = "openrouter" }
reranker = { id = "qwen/qwen3-reranker-8b", backend = "openrouter" }

[retrieval.stacks.v1_bm25]  # v1 replica: Okapi BM25 + spaCy lookup lemmatization
kind = "bm25"
bm25_k1 = 1.2
bm25_b = 0.75

[retrieval.stacks.v1_dense] # v1 replica: bge-large with v1's query instruction
kind = "dense"
dense = { id = "BAAI/bge-large-en-v1.5" }
query_instruction = "Represent this sentence for searching relevant passages: "

[selection]
k_grid = [0, 1, 2, 4, 8, 16, 32, 64]   # capped per dataset at pool size - 1
loo_queries = 200                      # seeded subsample; CrossNER pools are used whole
pool_sizes = [50, 100, 200, 400, 800, 1600]
format_k = 8

[stats]
resamples = 10000
alpha = 0.05
audit_prompts = 300
probe_lines = 40
output_factor = 1.25   # budget: estimated output = gold answer tokens * factor + extra
output_extra = 8

