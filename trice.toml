# --------------------------------------------------------------------------- studies
# models: all | reference | [names]; datasets: all | [names] (pool variants: conll2003@50)
# conditions: zero_shot | random:<seed> | <stack>/<stage>  (stages: full, rrf, sparse, dense)
# k: k_star | grid | <int>;  formats: frozen | others | [P0, P1, P2, P3]

[studies.S0]
queries = "loo"
models = "reference"
conditions = ["small/full"]
k = 8
formats = ["P0", "P1", "P2", "P3"]

[studies.S1-loo]
queries = "loo"
conditions = ["small/full"]
k = "grid"

[studies.S1]
conditions = ["zero_shot", "random:0", "small/full"]

[studies.S2]
models = "reference"
conditions = ["random:1", "random:2", "small/sparse", "small/dense", "small/rrf", "large/full", "v1_bm25/full", "v1_dense/full"]

[studies.S3]
models = "reference"
conditions = ["small/full"]
formats = "others"

[studies.S4]
models = "reference"
conditions = ["small/full"]
k = "grid"

[studies.S6-loo]
queries = "loo"
models = ["qwen3.5-9b"]
datasets = ["conll2003@50", "conll2003@100", "conll2003@200", "conll2003@400", "conll2003@800", "conll2003@1600"]
conditions = ["small/full"]
k = "grid"

[studies.S6]
models = ["qwen3.5-9b"]
datasets = ["conll2003@50", "conll2003@100", "conll2003@200", "conll2003@400", "conll2003@800", "conll2003@1600"]
conditions = ["random:0", "small/full"]

# Specialist baselines (envs/baselines, run in Docker): zero-shot, and few-shot fine-tuning where
# `finetune` is set. Revisions are pinned commits of the Hugging Face repositories.
[baselines.gliner2-large]
library = "gliner2"
model = "fastino/gliner2-large-v1"
revision = "d7aa8a2850d175a9227ff80358ea380723d03ad2"

[baselines.gliner2_5-base]
library = "gliner2"
model = "fastino/gliner2.5-base-v1"
revision = "54785d51df8d86a0d8f2eb212fec15871aad2c4d"

[baselines.gliner-v2_5-large]
library = "gliner"
model = "gliner-community/gliner_large-v2.5"
revision = "3d6d1760be1c591069f85f207fced9214df8b15f"
finetune = true

[baselines.nuner-zero]
