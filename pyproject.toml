[project]
name = "trice"
version = "0.1.0"
description = "TRICE: Tuning-free Retrieval for In-Context Entity recognition"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Enzo Shiraishi" }]
requires-python = ">=3.14.6,<3.15"
dependencies = [
    "bm25s>=0.3.13",
    "datasets>=5.1.0",
    "diskcache>=5.6.3",
    "evaluate>=0.4.6",
    "jinja2>=3.1.6",
    "kneed>=0.8.6",
    "matplot2tikz>=0.5.4",
    "openai>=3.29.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
    "scikit-posthocs>=0.17.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.1.0",
    "seqeval>=1.2.2",
    "spacy>=3.8.16",
    "spacy-lookups-data>=1.0.5",
    "statsmodels>=0.15.0",
    "torch>=2.14.1",
    "transformers>=5.19.0",
    "typer>=0.27.3",
]

[project.scripts]
trice = "trice.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "tomli-w>=1.2.0",
    "ty>=0.0.86",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "NPY"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["network: needs HuggingFace/OpenRouter access"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT018"]
# Baseline scripts seed numpy's legacy global RNG on purpose (libraries read it).
"envs/*" = ["NPY002"]
