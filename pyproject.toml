[project]
name = "trice"
version = "0.1.0"
description = "TRICE: Tuning-free Retrieval for In-Context Entity recognition"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Enzo Shiraishi" }]
requires-python = ">=3.14.6,<3.15"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=1.3",
    "jinja2>=3.1.6",
    "kneed>=0.8.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "polars>=2.0.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tenacity>=9.2.1",
    "transformers>=5.19.0",
    "typer>=0.27.3",
]

[project.optional-dependencies]
# Local encoders and rerankers (small stack, v1 dense replica). Needs torch.
retrieval = [
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
]
# v1 replica of the BM25 baseline (Okapi BM25 + spaCy lookup lemmatization).
v1 = [
    "bm25s>=0.3.13",
    "spacy>=3.8.16",
    "spacy-lookups-data>=1.0.5",
]

[project.scripts]
trice = "trice.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "torch: needs the `retrieval` extra (torch + sentence-transformers) and model weights",
    "network: needs network access to HuggingFace/OpenRouter",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT018"]
# Baseline scripts seed numpy's legacy global RNG on purpose (libraries read it).
"envs/*" = ["NPY002"]

[tool.ty.analysis]
# Optional extras (`retrieval`) that are not installed in the light dev environment.
allowed-unresolved-imports = ["torch", "torch.**", "sentence_transformers", "sentence_transformers.**"]
