[project]
name = "trice-baselines"
version = "0.1.0"
description = "Specialist NER baselines (GLiNER family, NuNER-Zero) writing canonical predictions"
requires-python = ">=3.14.6,<3.15"
# gliner pins transformers <5.17, so the baselines live in their own uv project.
dependencies = [
    "gliner>=0.2.29",
    "gliner2>=2.1.0",
    "torch>=2.10",
]

[tool.uv]
package = false
